<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="20" viewBox="0 -6 1000 20" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Gradiente de la línea base -->
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#a78bfa" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#c4b5fd"/>
      <stop offset="0.85" stop-color="#a78bfa" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>

    <!-- Pulso magenta -->
    <linearGradient id="pulse" x1="0" x2="1">
      <stop offset="0" stop-color="#f0abfc" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f0abfc"/>
      <stop offset="1" stop-color="#f0abfc" stop-opacity="0"/>
    </linearGradient>

    <!-- Pulso cian (glitch) -->
    <linearGradient id="pulse2" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>

    <!-- Resplandor fuerte -->
    <filter id="glow" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Resplandor suave -->
    <filter id="softGlow" x="-100%" y="-500%" width="300%" height="1100%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <!-- Fondo sutilmente tintado para integrarse con el banner -->
  <rect x="0" y="0" width="1000" height="14" fill="#050217" opacity="0.45"/>

  <!-- Línea base con gradiente -->
  <rect x="0" y="6" width="1000" height="2" fill="url(#line)" opacity="0.8"/>

  <!-- Halo suave tras el centro -->
  <ellipse cx="500" cy="7" rx="90" ry="6" fill="#a78bfa" opacity="0.35" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.25;0.5;0.25" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Viajeros de energía -->
  <rect x="-120" y="5.5" width="120" height="3" fill="url(#pulse)" filter="url(#glow)">
    <animate attributeName="x" values="-120;1000" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="1000" y="5.5" width="80" height="3" fill="url(#pulse2)" opacity="0.75" filter="url(#glow)">
    <animate attributeName="x" values="1000;-80" dur="6.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Rombo central (eco del banner) -->
  <g transform="translate(500,7)">
    <path d="M0 -6 L6 0 L0 6 L-6 0Z" fill="#c4b5fd" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M0 -3 L3 0 L0 3 L-3 0Z" fill="#f0abfc">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Rombos satélite laterales -->
  <path d="M340 7 L344 3 L348 7 L344 11Z" fill="#a78bfa" opacity="0.7">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <path d="M652 7 L656 3 L660 7 L656 11Z" fill="#a78bfa" opacity="0.7">
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- Símbolos de sintaxis viajeros en la línea -->
  <g font-family="'Courier New', Consolas, monospace" font-weight="700" font-size="9">
    <text x="-30" y="10" fill="#a78bfa" opacity="0.75">&lt;/&gt;
      <animateTransform attributeName="transform" type="translate" values="0,0; 1060,0" dur="18s" repeatCount="indefinite"/>
    </text>
    <text x="1030" y="4" fill="#c4b5fd" opacity="0.65">{ }
      <animateTransform attributeName="transform" type="translate" values="0,0; -1060,0" dur="22s" repeatCount="indefinite"/>
    </text>
    <text x="-50" y="10" fill="#f0abfc" opacity="0.7">=&gt;
      <animateTransform attributeName="transform" type="translate" values="0,0; 1100,0" dur="26s" repeatCount="indefinite"/>
    </text>
    <text x="1030" y="4" fill="#e879f9" opacity="0.6">; 
      <animateTransform attributeName="transform" type="translate" values="0,0; -1060,0" dur="20s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>