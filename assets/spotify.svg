<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-label="Mi banda sonora en Spotify" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050217"/><stop offset="0.55" stop-color="#120731"/><stop offset="1" stop-color="#2a0d5e"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9d5ff"/><stop offset="0.5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/><stop offset="0.5" stop-color="#f0abfc"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="prog" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="eqg" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="rounded"><rect width="900" height="180" rx="24" ry="24"/></clipPath>
  </defs>
  <style>
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 7s linear infinite; }
    .eq   { transform-box: fill-box; transform-origin: bottom; animation: eq 1.2s ease-in-out infinite; }
    .live { animation: live 1.6s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }
    @keyframes eq   { 0%,100% { transform: scaleY(.3) } 50% { transform: scaleY(1) } }
    @keyframes live { 0%,100% { opacity:.35 } 50% { opacity:1 } }
  </style>

  <g clip-path="url(#rounded)">
    <rect width="900" height="180" fill="url(#bg)"/>

    <g font-family="'Courier New', Consolas, monospace" font-weight="700">
    <g transform="translate(655,26)"><g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 5,-3; 0,0; -4,4; 0,0" dur="9s" repeatCount="indefinite"/>
      <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#a78bfa" opacity="0.34">&lt;/&gt;</text>
    </g></g>
    <g transform="translate(735,22)"><g>
      <animateTransform attributeName="transform" type="translate" values="0,0; -4,3; 0,0; 5,-4; 0,0" dur="10s" repeatCount="indefinite"/>
      <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="18" fill="#c4b5fd" opacity="0.34">{ }</text>
    </g></g>
    <g transform="translate(815,34)"><g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 4,-4; 0,0; -5,3; 0,0" dur="11s" repeatCount="indefinite"/>
      <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="20" fill="#e879f9" opacity="0.34">[ ]</text>
    </g></g>
    <g transform="translate(880,22)"><g>
      <animateTransform attributeName="transform" type="translate" values="0,0; -5,3; 0,0; 4,-3; 0,0" dur="12s" repeatCount="indefinite"/>
      <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#f0abfc" opacity="0.34">=&gt;</text>
    </g></g>
    <g transform="translate(868,72)"><g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 5,-3; 0,0; -4,3; 0,0" dur="9s" repeatCount="indefinite"/>
      <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="18" fill="#a78bfa" opacity="0.34">;</text>
    </g></g>
    <g transform="translate(650,62)"><g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 5,-3; 0,0; -4,4; 0,0" dur="10s" repeatCount="indefinite"/>
      <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="20" fill="#c4b5fd" opacity="0.34">::</text>
    </g></g>
    <g transform="translate(760,64)"><g>
      <animateTransform attributeName="transform" type="translate" values="0,0; -4,3; 0,0; 5,-4; 0,0" dur="11s" repeatCount="indefinite"/>
      <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#e879f9" opacity="0.34">#</text>
    </g></g>
    <g transform="translate(872,168)"><g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 4,-4; 0,0; -5,3; 0,0" dur="12s" repeatCount="indefinite"/>
      <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="18" fill="#f0abfc" opacity="0.34">%</text>
    </g></g>
    <g transform="translate(660,164)"><g>
      <animateTransform attributeName="transform" type="translate" values="0,0; -5,3; 0,0; 4,-3; 0,0" dur="9s" repeatCount="indefinite"/>
      <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="20" fill="#a78bfa" opacity="0.34">( )</text>
    </g></g>
    <g transform="translate(30,26)"><g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 5,-3; 0,0; -4,3; 0,0" dur="10s" repeatCount="indefinite"/>
      <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#c4b5fd" opacity="0.34">$</text>
    </g></g>
    <g transform="translate(30,160)"><g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 5,-3; 0,0; -4,4; 0,0" dur="11s" repeatCount="indefinite"/>
      <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="18" fill="#e879f9" opacity="0.34">*</text>
    </g></g>
    <g transform="translate(180,22)"><g>
      <animateTransform attributeName="transform" type="translate" values="0,0; -4,3; 0,0; 5,-4; 0,0" dur="12s" repeatCount="indefinite"/>
      <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="20" fill="#f0abfc" opacity="0.34">||</text>
    </g></g>
    </g>

    <circle cx="800" cy="20" r="120" fill="#7c3aed" opacity="0.22" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.16;0.30;0.16" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="170" r="110" fill="#c026d3" opacity="0.16" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.10;0.24;0.10" dur="7s" repeatCount="indefinite"/>
    </circle>

    <rect x="0" y="0" width="900" height="2" fill="url(#accentGrad)"/>
    <rect x="0" y="178" width="900" height="2" fill="url(#accentGrad)"/>

    <!-- Disco de vinilo -->
    <g class="spin">
      <circle cx="110" cy="90" r="64" fill="#0a0420"/>
      <circle cx="110" cy="90" r="58" fill="none" stroke="#2a1a55" stroke-width="1"/>
      <circle cx="110" cy="90" r="52" fill="none" stroke="#2a1a55" stroke-width="1"/>
      <circle cx="110" cy="90" r="46" fill="none" stroke="#2a1a55" stroke-width="1"/>
      <circle cx="110" cy="90" r="40" fill="none" stroke="#2a1a55" stroke-width="1"/>
      <circle cx="110" cy="90" r="34" fill="none" stroke="#2a1a55" stroke-width="1"/>
      <circle cx="110" cy="90" r="28" fill="none" stroke="#2a1a55" stroke-width="1"/>
      <path d="M70 62 A48 48 0 0 1 100 44" fill="none" stroke="#e9d5ff" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
      <circle cx="110" cy="90" r="22" fill="url(#lab)"/>
      <circle cx="110" cy="90" r="4" fill="#050217"/>
    </g>

    <!-- Texto -->
    <circle class="live" cx="214" cy="46" r="5" fill="#1DB954"/>
    <text x="228" y="51" font-family="'Courier New', Consolas, monospace" font-weight="700" font-size="13" fill="#22d3ee" letter-spacing="4">SPOTIFY · MI BANDA SONORA</text>

    <g font-family="'Courier New', Consolas, monospace" font-weight="700" font-size="28" letter-spacing="2">
      <text x="210" y="92" fill="#22d3ee" opacity="0.5">NOMBRE DE TU PLAYLIST
        <animateTransform attributeName="transform" type="translate" values="0,0; -3,0; 2,0; 0,0; 0,0; -3,0; 0,0; 0,0; 0,0" keyTimes="0;0.03;0.06;0.09;0.5;0.53;0.56;0.8;1" dur="4s" repeatCount="indefinite"/>
      </text>
      <text x="210" y="92" fill="#e879f9" opacity="0.5">NOMBRE DE TU PLAYLIST
        <animateTransform attributeName="transform" type="translate" values="0,0; 4,0; -3,0; 0,0; 0,0; 3,0; 0,0; 0,0; 0,0" keyTimes="0;0.03;0.06;0.09;0.5;0.53;0.56;0.8;1" dur="4s" repeatCount="indefinite"/>
      </text>
      <text x="210" y="92" fill="url(#titleGrad)" filter="url(#glow)">NOMBRE DE TU PLAYLIST</text>
    </g>

    <text x="210" y="122" font-family="'Courier New', Consolas, monospace" font-size="14" fill="#a78bfa" letter-spacing="4">ROCK · CAFÉ · CIELO ESTRELLADO</text>

    <!-- Barra de progreso -->
    <rect x="210" y="146" width="420" height="4" rx="2" fill="#4c1d95" opacity="0.7"/>
    <rect x="210" y="146" width="0" height="4" rx="2" fill="url(#prog)" filter="url(#glow)">
      <animate attributeName="width" values="0;420;420" keyTimes="0;0.95;1" dur="24s" repeatCount="indefinite"/>
    </rect>
    <circle cx="210" cy="148" r="6" fill="#f0abfc" filter="url(#glow)">
      <animate attributeName="cx" values="210;630;630" keyTimes="0;0.95;1" dur="24s" repeatCount="indefinite"/>
    </circle>

    <!-- Ecualizador -->
    <rect class="eq" style="animation-delay:0.87s;animation-duration:1.49s" x="700" y="118" width="9" height="34" rx="2" fill="url(#eqg)"/>
    <rect class="eq" style="animation-delay:1.11s;animation-duration:1.65s" x="715" y="94" width="9" height="58" rx="2" fill="url(#eqg)"/>
    <rect class="eq" style="animation-delay:1.04s;animation-duration:1.64s" x="730" y="126" width="9" height="26" rx="2" fill="url(#eqg)"/>
    <rect class="eq" style="animation-delay:0.04s;animation-duration:1.27s" x="745" y="88" width="9" height="64" rx="2" fill="url(#eqg)"/>
    <rect class="eq" style="animation-delay:1.32s;animation-duration:1.42s" x="760" y="108" width="9" height="44" rx="2" fill="url(#eqg)"/>
    <rect class="eq" style="animation-delay:1.26s;animation-duration:0.99s" x="775" y="82" width="9" height="70" rx="2" fill="url(#eqg)"/>
    <rect class="eq" style="animation-delay:0.66s;animation-duration:1.1s" x="790" y="122" width="9" height="30" rx="2" fill="url(#eqg)"/>
    <rect class="eq" style="animation-delay:0.76s;animation-duration:1.36s" x="805" y="96" width="9" height="56" rx="2" fill="url(#eqg)"/>
    <rect class="eq" style="animation-delay:0.02s;animation-duration:1.07s" x="820" y="112" width="9" height="40" rx="2" fill="url(#eqg)"/>
    <rect class="eq" style="animation-delay:0.39s;animation-duration:1.63s" x="835" y="86" width="9" height="66" rx="2" fill="url(#eqg)"/>
    <rect class="eq" style="animation-delay:1.07s;animation-duration:1.03s" x="850" y="124" width="9" height="28" rx="2" fill="url(#eqg)"/>
    <rect class="eq" style="animation-delay:1.12s;animation-duration:1.01s" x="865" y="100" width="9" height="52" rx="2" fill="url(#eqg)"/>
  </g>

  <rect x="1" y="1" width="898" height="178" rx="24" ry="24" fill="none" stroke="#7c3aed" stroke-opacity="0.65" stroke-width="2"/>
  <rect x="4" y="4" width="892" height="172" rx="21" ry="21" fill="none" stroke="#c4b5fd" stroke-opacity="0.22" stroke-width="1"/>
</svg>
