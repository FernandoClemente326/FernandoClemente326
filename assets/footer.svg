<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170" role="img" aria-label="Gracias por visitar mi perfil" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050217"/><stop offset="0.55" stop-color="#120731"/><stop offset="1" stop-color="#2a0d5e"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#e9d5ff"/><stop offset="0.5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#f0abfc"/>
      <animate attributeName="x1" values="0;0.6;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;1.6;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/><stop offset="0.5" stop-color="#f0abfc"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    <clipPath id="rounded"><rect width="1000" height="170" rx="24" ry="24"/></clipPath>
    <clipPath id="typeclip">
      <rect x="364" y="120" width="0" height="30">
        <animate attributeName="width" values="0;276;276;0" keyTimes="0;0.45;0.9;1" dur="7s" begin="0.8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>
  <style>
    .cur { animation: blink 1s steps(2, start) infinite; }
    @keyframes blink { to { opacity: 0 } }
  </style>

  <g clip-path="url(#rounded)">
    <rect width="1000" height="170" fill="url(#bg)"/>

    <!-- Símbolos de código flotando -->
    <g font-family="'Courier New', Consolas, monospace" font-weight="700">
    <g transform="translate(40,34)"><g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 5,-3; 0,0; -4,4; 0,0" dur="9s" repeatCount="indefinite"/>
      <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#a78bfa" opacity="0.36">&lt;/&gt;</text>
    </g></g>
    <g transform="translate(130,130)"><g>
      <animateTransform attributeName="transform" type="translate" values="0,0; -4,3; 0,0; 5,-4; 0,0" dur="10s" repeatCount="indefinite"/>
      <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="19" fill="#c4b5fd" opacity="0.36">{ }</text>
    </g></g>
    <g transform="translate(230,30)"><g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 4,-4; 0,0; -5,3; 0,0" dur="11s" repeatCount="indefinite"/>
      <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="22" fill="#e879f9" opacity="0.36">[ ]</text>
    </g></g>
    <g transform="translate(330,138)"><g>
      <animateTransform attributeName="transform" type="translate" values="0,0; -5,3; 0,0; 4,-3; 0,0" dur="12s" repeatCount="indefinite"/>
      <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#f0abfc" opacity="0.36">=&gt;</text>
    </g></g>
    <g transform="translate(670,30)"><g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 5,-3; 0,0; -4,3; 0,0" dur="9s" repeatCount="indefinite"/>
      <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="19" fill="#a78bfa" opacity="0.36">( )</text>
    </g></g>
    <g transform="translate(770,136)"><g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 5,-3; 0,0; -4,4; 0,0" dur="10s" repeatCount="indefinite"/>
      <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="22" fill="#c4b5fd" opacity="0.36">;</text>
    </g></g>
    <g transform="translate(870,34)"><g>
      <animateTransform attributeName="transform" type="translate" values="0,0; -4,3; 0,0; 5,-4; 0,0" dur="11s" repeatCount="indefinite"/>
      <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#e879f9" opacity="0.36">::</text>
    </g></g>
    <g transform="translate(960,128)"><g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 4,-4; 0,0; -5,3; 0,0" dur="12s" repeatCount="indefinite"/>
      <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="19" fill="#f0abfc" opacity="0.36">#</text>
    </g></g>
    <g transform="translate(36,110)"><g>
      <animateTransform attributeName="transform" type="translate" values="0,0; -5,3; 0,0; 4,-3; 0,0" dur="9s" repeatCount="indefinite"/>
      <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="22" fill="#a78bfa" opacity="0.36">$</text>
    </g></g>
    <g transform="translate(180,80)"><g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 5,-3; 0,0; -4,3; 0,0" dur="10s" repeatCount="indefinite"/>
      <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#c4b5fd" opacity="0.36">*</text>
    </g></g>
    <g transform="translate(820,84)"><g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 5,-3; 0,0; -4,4; 0,0" dur="11s" repeatCount="indefinite"/>
      <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="19" fill="#e879f9" opacity="0.36">%</text>
    </g></g>
    <g transform="translate(960,64)"><g>
      <animateTransform attributeName="transform" type="translate" values="0,0; -4,3; 0,0; 5,-4; 0,0" dur="12s" repeatCount="indefinite"/>
      <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="22" fill="#f0abfc" opacity="0.36">||</text>
    </g></g>
    <g transform="translate(100,60)"><g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 4,-4; 0,0; -5,3; 0,0" dur="9s" repeatCount="indefinite"/>
      <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#a78bfa" opacity="0.36">@</text>
    </g></g>
    <g transform="translate(900,100)"><g>
      <animateTransform attributeName="transform" type="translate" values="0,0; -5,3; 0,0; 4,-3; 0,0" dur="10s" repeatCount="indefinite"/>
      <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="19" fill="#c4b5fd" opacity="0.36">&amp;&amp;</text>
    </g></g>
    </g>

    <!-- Halos de luz -->
    <circle cx="150" cy="20" r="120" fill="#7c3aed" opacity="0.22" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.16;0.30;0.16" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="160" r="120" fill="#c026d3" opacity="0.18" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.10;0.26;0.10" dur="7s" repeatCount="indefinite"/>
    </circle>

    <rect x="0" y="0" width="1000" height="2" fill="url(#accentGrad)"/>
    <rect x="0" y="168" width="1000" height="2" fill="url(#accentGrad)"/>

    <!-- Texto -->
    <g text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-weight="700">
      <text x="500" y="44" font-size="13" fill="#22d3ee" letter-spacing="6">FIN DEL ARCHIVO</text>

      <g font-size="38" letter-spacing="3">
        <text x="500" y="94" fill="#22d3ee" opacity="0.5">GRACIAS POR VISITAR
          <animateTransform attributeName="transform" type="translate" values="0,0; -3,0; 2,0; 0,0; 0,0; -3,0; 0,0; 0,0; 0,0" keyTimes="0;0.03;0.06;0.09;0.5;0.53;0.56;0.8;1" dur="4s" repeatCount="indefinite"/>
        </text>
        <text x="500" y="94" fill="#e879f9" opacity="0.5">GRACIAS POR VISITAR
          <animateTransform attributeName="transform" type="translate" values="0,0; 4,0; -3,0; 0,0; 0,0; 3,0; 0,0; 0,0; 0,0" keyTimes="0;0.03;0.06;0.09;0.5;0.53;0.56;0.8;1" dur="4s" repeatCount="indefinite"/>
        </text>
        <text x="500" y="94" fill="url(#titleGrad)" filter="url(#glow)">GRACIAS POR VISITAR</text>
      </g>
    </g>

    <!-- Línea que se escribe sola -->
    <g clip-path="url(#typeclip)">
      <text x="364" y="140" font-family="'Courier New', Consolas, monospace" font-size="18" fill="#c4b5fd" letter-spacing="1">
        <tspan fill="#e879f9">&gt;</tspan> seguir_aprendiendo();
      </text>
    </g>
    <rect class="cur" x="364" y="123" width="9" height="22" fill="#f0abfc" opacity="0.95">
      <animate attributeName="x" values="364;640;640;364" keyTimes="0;0.45;0.9;1" dur="7s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="998" height="168" rx="24" ry="24" fill="none" stroke="#7c3aed" stroke-opacity="0.65" stroke-width="2"/>
  <rect x="4" y="4" width="992" height="162" rx="21" ry="21" fill="none" stroke="#c4b5fd" stroke-opacity="0.22" stroke-width="1"/>
</svg>
